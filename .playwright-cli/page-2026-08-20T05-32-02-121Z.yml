        - generic [ref=f5e17]: WHAT IS THIS
        - paragraph [ref=f5e21]: Access to astrology this accurate has historically been restricted to those with access to personal astrologers—now these predictions can be anyone's.
        - paragraph [ref=f5e25]: Our powerful natural-language engine uses NASA data, coupled with the methods of professional astrologers, to algorithmically generate insights about who you are and how you relate to others.
        - paragraph [ref=f5e29]: Astrology puts our temporary bodies in context with our universe's vastness, allowing irrationality to invade our techno-rationalist ways of living.
