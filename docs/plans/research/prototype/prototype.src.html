<title>Innerverse Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;800;900&family=Onest:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: one phone-width column on sunny paper; ink-outlined doodles in the interface, felt for keepsakes;
   a five-slot tab bar whose centre button («Узелок») holds the labyrinth and its thread.
   Light is the default. «Небо» (sky mode) is the product's dark mode, chosen in the app, so it uses data-mode, not the host theme. */
:root {
  --bg: #FBF4E6; --surface: #FFFFFF; --surface-2: #F3EAD8; --ink: #1C1830; --ink-dim: rgba(28,24,48,.74); --ink-faint: rgba(28,24,48,.56);
  --line: #1C1830; --soft: rgba(28,24,48,.14); --shadow: #1C1830; --dl: #1C1830;
  --yellow: #FFD43B; --on-yellow: #1C1830; --lilac: #8E6CFF; --lilac-ink: #5A3FD1; --mint: #3DCB8E; --pink: #FF6FA8; --red: #E5484D; --thread: #E5484D;
  --t-pink: #FFE3EE; --t-blue: #E3EEFF; --t-yellow: #FFF1C2; --t-mint: #DDF6EA; --t-lilac: #ECE6FF; --t-red: #FDE2E2;
  --sky-1: #2A2160; --sky-2: #1A1540; --on-sky: #F4ECDE; --star: #F6E7B0;
  --stars: none;
  --display: 'Rubik', 'Arial Black', system-ui, sans-serif;
  --body: 'Onest', 'Segoe UI', Roboto, system-ui, sans-serif;
  --hand: 'Caveat', 'Segoe Print', cursive;
}
:root[data-mode="sky"] {
  --bg: #15122B; --surface: #221C42; --surface-2: #2C2553; --ink: #F4ECDE; --ink-dim: rgba(244,236,222,.8); --ink-faint: rgba(244,236,222,.6);
  --line: rgba(244,236,222,.55); --soft: rgba(244,236,222,.16); --shadow: rgba(0,0,0,.6); --dl: #F4ECDE;
  --lilac-ink: #C2B2FF;
  --t-pink: #3A2141; --t-blue: #1E2B4F; --t-yellow: #3B3320; --t-mint: #173A2E; --t-lilac: #2F2760; --t-red: #3A1D2A;
  --stars: radial-gradient(1.4px 1.4px at 12% 18%, var(--star) 60%, transparent 62%), radial-gradient(1.2px 1.2px at 78% 9%, var(--star) 60%, transparent 62%),
    radial-gradient(1px 1px at 45% 32%, var(--star) 60%, transparent 62%), radial-gradient(1.6px 1.6px at 88% 44%, var(--star) 60%, transparent 62%),
    radial-gradient(1px 1px at 22% 63%, var(--star) 60%, transparent 62%), radial-gradient(1.3px 1.3px at 64% 77%, var(--star) 60%, transparent 62%),
    radial-gradient(1px 1px at 35% 92%, var(--star) 60%, transparent 62%), radial-gradient(1.2px 1.2px at 92% 86%, var(--star) 60%, transparent 62%);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background-color: var(--bg); background-image: var(--stars); background-size: 420px 520px; background-attachment: fixed; color: var(--ink); font: 400 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--lilac); outline-offset: 3px; border-radius: 8px; }
img { max-width: 100%; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
svg.dd { display: block; width: 52px; height: 52px; overflow: visible; flex: none; }

.app { max-width: 460px; margin: 0 auto; min-height: 100vh; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(112px + env(safe-area-inset-bottom, 0px)); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 12px 10px; }
.brand { font: 900 17px/1 var(--display); letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.brand svg { width: 26px; height: 26px; }
.bar-r { display: flex; align-items: center; gap: 8px; }
.proto { font: 700 11px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); border: 1.5px dashed var(--soft); border-radius: 999px; padding: 6px 9px; }
.modebtn { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; box-shadow: 0 2px 0 var(--shadow); }
.modebtn svg { width: 20px; height: 20px; }

#view { display: grid; gap: 16px; padding-top: 4px; }
.kicker { font: 800 11.5px/1.2 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--lilac-ink); }
.mega { font: 900 clamp(44px, 13.5vw, 60px)/.92 var(--display); letter-spacing: -.035em; }
.h1 { font: 900 clamp(30px, 8vw, 38px)/1.02 var(--display); letter-spacing: -.02em; }
.h2 { font: 900 22px/1.1 var(--display); letter-spacing: -.01em; }
.h3 { font: 900 17px/1.15 var(--display); }
.lede { color: var(--ink-dim); font-size: 16px; }
.muted { color: var(--ink-dim); }
.faint { color: var(--ink-faint); font-size: 13px; }
.hand { font: 700 22px/1.1 var(--hand); color: var(--lilac-ink); }
.stack { display: grid; gap: 10px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; }

.card { background: var(--surface); border: 2px solid var(--line); border-radius: 22px; padding: 16px; box-shadow: 3px 3px 0 var(--shadow); min-width: 0; }
.card.lilac { background: var(--t-lilac); } .card.mint { background: var(--t-mint); } .card.yellow { background: var(--t-yellow); }
.card.pink { background: var(--t-pink); } .card.blue { background: var(--t-blue); }
.card.dash { border-style: dashed; box-shadow: none; background: var(--surface-2); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; padding: 0 18px; border: 2.5px solid var(--line); border-radius: 20px; background: var(--yellow); color: var(--on-yellow); font: 900 17px/1 var(--display); box-shadow: 0 5px 0 var(--shadow); transition: transform .08s, box-shadow .08s; width: 100%; text-decoration: none; }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--shadow); }
.btn.ghost { background: var(--surface); color: var(--ink); }
.btn.lilac { background: var(--lilac); color: #FFFFFF; }
.btn.small { min-height: 42px; font-size: 14.5px; border-radius: 14px; width: auto; box-shadow: 0 3px 0 var(--shadow); }
.btn[disabled] { opacity: .45; cursor: default; }
.link { background: none; border: 0; padding: 6px 0; font: 700 14px/1.2 var(--body); color: var(--lilac-ink); text-decoration: underline; text-underline-offset: 3px; justify-self: start; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; }
.meta span, .tag { font: 700 12px/1 var(--body); padding: 6px 10px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); }

/* speech bubble: the part's own line, in its voice */
.says { position: relative; display: inline-block; justify-self: start; max-width: 100%; font: 700 19px/1.1 var(--hand); color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 6px 12px 7px; }
.says::after { content: ""; position: absolute; left: 18px; bottom: -8px; width: 12px; height: 12px; background: inherit; border-right: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: rotate(45deg); }

/* night sky card (light mode keeps it as a window; sky mode is the whole page) */
.sky { position: relative; width: 100%; max-width: 100%; aspect-ratio: 1 / .8; border: 2px solid var(--line); border-radius: 28px; overflow: hidden; background: radial-gradient(80% 70% at 50% 45%, var(--sky-1), var(--sky-2)); box-shadow: 4px 4px 0 var(--shadow); color: var(--on-sky); }
.sky .stars { position: absolute; inset: 0; width: 100%; height: 100%; }
.sky .orbit { position: absolute; left: 50%; top: 47%; transform: translate(-50%, -50%); border: 1.5px dashed rgba(244,236,222,.28); border-radius: 50%; }
.sky .sun { position: absolute; left: 50%; top: 47%; width: 28%; transform: translate(-50%, -50%); transition: filter .6s; }
.sky .sun svg { width: 100%; height: auto; display: block; }
.sky .pt { position: absolute; width: 23%; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 4px; background: none; border: 0; padding: 0; color: var(--on-sky); }
.sky .pt img { width: 100%; max-height: 88px; object-fit: contain; filter: drop-shadow(0 6px 6px rgba(0,0,0,.35)); }
.sky .pt svg.dd { width: 64%; height: auto; aspect-ratio: 1; --dl: #1C1830; }
.sky .pt span { font: 800 10.5px/1.15 var(--display); text-align: center; background: rgba(20,16,44,.72); padding: 3px 7px; border-radius: 999px; max-width: 130%; }
.sky .pt.lbl span { background: #FFFFFF; color: #1C1830; border: 1.5px solid #1C1830; font: 700 14px/1 var(--hand); padding: 3px 8px 4px; white-space: nowrap; }
.sky .cover { position: absolute; right: 10px; top: 10px; font: 700 11px/1 var(--body); color: var(--on-sky); border: 1.5px dashed rgba(244,236,222,.6); border-radius: 999px; padding: 6px 9px; }
.sky .luna { position: absolute; left: 5%; bottom: 5%; width: 14%; }

/* welcome */
.hero-head { display: grid; gap: 10px; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile { display: grid; gap: 6px; align-content: start; text-align: left; border: 2px solid var(--line); border-radius: 18px; padding: 10px 10px 12px; box-shadow: 2px 2px 0 var(--shadow); min-width: 0; }
.tile svg.dd { width: 46px; height: 46px; }
.tile b { font: 900 14px/1.1 var(--display); }
.tile small { font-size: 12px; line-height: 1.3; color: var(--ink-dim); }
.tile:nth-child(1) { background: var(--t-blue); } .tile:nth-child(2) { background: var(--t-yellow); } .tile:nth-child(3) { background: var(--t-pink); }
.steps-how { display: grid; gap: 10px; counter-reset: how; }
.steps-how li { list-style: none; display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: start; }
.steps-how li::before { counter-increment: how; content: counter(how); width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font: 900 18px/1 var(--display); border: 2px solid var(--line); background: var(--yellow); color: var(--on-yellow); }
.steps-how b { display: block; font: 900 16px/1.2 var(--display); }

/* test */
.prog { height: 10px; border: 2px solid var(--line); border-radius: 6px; background: var(--surface); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--lilac); transition: width .3s; }
.scene { font-size: 14.5px; color: var(--ink-dim); }
.ask { font: 900 22px/1.12 var(--display); margin-top: 6px; }
.answers { display: grid; gap: 10px; }
.ans { display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center; text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 8px 12px 8px 8px; box-shadow: 3px 3px 0 var(--shadow); font: 600 14.5px/1.35 var(--body); }
.ans:hover { background: var(--surface-2); }

/* part rows */
.plist { display: grid; gap: 10px; }
.pr { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 10px 12px 10px 10px; box-shadow: 3px 3px 0 var(--shadow); width: 100%; }
.pr svg.dd { width: 56px; height: 56px; }
.pr b { display: block; font: 900 15px/1.15 var(--display); }
.pr small { display: block; font-size: 12.5px; color: var(--ink-faint); }
.pr .line { display: block; font: 700 17px/1.05 var(--hand); color: var(--lilac-ink); margin-top: 3px; }
.pr.quiet { box-shadow: none; border-style: dashed; }
.stage { font: 800 10.5px/1 var(--body); padding: 5px 8px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface-2); white-space: nowrap; }
.stage.s2 { background: var(--t-lilac); } .stage.s3 { background: var(--t-yellow); } .stage.s4, .stage.s5 { background: var(--t-mint); }
.chev { font: 900 20px/1 var(--display); color: var(--ink-faint); }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border: 2px solid var(--line); border-radius: 999px; background: var(--surface); }
.seg button { border: 0; background: none; border-radius: 999px; padding: 9px 8px; font: 800 13.5px/1 var(--display); color: var(--ink-dim); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.seg button svg { width: 16px; height: 16px; }
.seg button[aria-pressed="true"] { background: var(--yellow); color: var(--on-yellow); }
.filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.filters button { flex: none; border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 13px; font: 800 13px/1 var(--display); }
.filters button[aria-pressed="true"] { background: var(--yellow); color: var(--on-yellow); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: grid; justify-items: center; gap: 4px; width: calc(33.33% - 6px); min-width: 0; background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 10px 4px 9px; box-shadow: 2px 2px 0 var(--shadow); font: 800 11.5px/1.15 var(--display); text-align: center; }
.chip svg.dd { width: 50px; height: 50px; }
.chip .q { width: 50px; height: 50px; display: grid; place-items: center; font: 900 24px/1 var(--display); border: 2px dashed var(--line); border-radius: 50%; }
.chip[aria-pressed="true"] { background: var(--yellow); color: var(--on-yellow); }
.feel { width: calc(25% - 6px); }
.feel svg.dd { width: 44px; height: 44px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pills button { border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; font: 700 13px/1 var(--body); }
.pills button[aria-pressed="true"] { background: var(--t-lilac); border-color: var(--lilac-ink); color: var(--ink); }

.daycard { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 14px; align-items: start; }
.daycard svg.dd { width: 76px; height: 76px; }
.task { font: 800 17px/1.25 var(--display); margin-top: 6px; }
.moon { display: flex; gap: 6px; justify-content: space-between; margin-top: 8px; }
.moon span { display: grid; justify-items: center; gap: 4px; font: 700 10.5px/1 var(--body); color: var(--ink-faint); flex: 1; }
.moon i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface-2); }
.moon i.on { background: var(--yellow); box-shadow: inset -6px 0 0 color-mix(in srgb, var(--yellow) 55%, #B88A00); }

/* part page */
.hero { position: relative; display: grid; place-items: center; height: 200px; border: 2px solid var(--line); border-radius: 26px; background: radial-gradient(70% 70% at 50% 70%, var(--sky-1), var(--sky-2)); box-shadow: 3px 3px 0 var(--shadow); overflow: hidden; }
.hero .stars { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero img { position: relative; width: auto; height: auto; max-width: 150px; max-height: 128px; filter: drop-shadow(0 10px 8px rgba(0,0,0,.4)); margin-top: 30px; }
.hero .says { position: absolute; left: 16px; top: 14px; max-width: 62%; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.arc { display: flex; gap: 4px; }
.arc i { flex: 1; height: 10px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--surface); }
.arc i.on { background: var(--yellow); }
.arc-l { display: flex; justify-content: space-between; font: 700 10.5px/1 var(--body); color: var(--ink-faint); margin-top: 5px; }
.sec b { display: block; font: 800 13px/1.2 var(--display); margin-bottom: 2px; }

/* knot (Узелок) and the thread */
.sos-card { display: grid; grid-template-columns: minmax(0, 1fr) 64px; gap: 12px; align-items: center; text-align: left; width: 100%; background: var(--t-pink); border: 2.5px solid var(--line); border-radius: 22px; padding: 16px; box-shadow: 0 5px 0 var(--shadow); }
.sos-card b { display: block; font: 900 22px/1.05 var(--display); }
.sos-card small { display: block; margin-top: 4px; color: var(--ink-dim); font-size: 13.5px; }
.sos-card svg.dd { width: 64px; height: 64px; }
.how4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.how4 span { display: grid; gap: 4px; justify-items: center; text-align: center; font: 800 11.5px/1.15 var(--display); }
.how4 i { font-style: normal; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--yellow); color: var(--on-yellow); border: 2px solid var(--line); font: 900 13px/1 var(--display); }
.thread { position: relative; display: grid; gap: 12px; padding-left: 26px; }
.thread::before { content: ""; position: absolute; left: 9px; top: 6px; bottom: 6px; width: 3px; border-radius: 3px; background: var(--thread); }
.thread .day { font: 800 11.5px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); margin-left: -26px; padding-left: 26px; }
.kn { position: relative; display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; align-items: start; text-align: left; width: 100%; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 8px 10px; }
.kn::before { content: ""; position: absolute; left: -24px; top: 16px; width: 13px; height: 13px; border-radius: 50%; background: var(--thread); border: 2.5px solid var(--bg); box-shadow: 0 0 0 2px var(--thread); }
.kn.big::before { width: 17px; height: 17px; left: -26px; top: 14px; }
.kn svg.dd { width: 40px; height: 40px; }
.kn b { font: 800 14px/1.2 var(--display); }
.kn p { font-size: 13px; color: var(--ink-dim); overflow-wrap: anywhere; }
.kn .t { font: 700 11.5px/1 var(--body); color: var(--ink-faint); }
.sosmark { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--t-pink); border: 2px solid var(--line); font: 900 18px/1 var(--display); }

/* SOS */
.steps { display: flex; gap: 6px; flex-wrap: wrap; }
.steps span { font: 800 11px/1 var(--body); padding: 6px 9px; border-radius: 999px; border: 1.5px solid var(--soft); color: var(--ink-faint); }
.steps span.on { border-color: var(--line); background: var(--yellow); color: var(--on-yellow); }
.steps span.done { color: var(--ink); border-color: var(--line); }
textarea { width: 100%; min-height: 64px; resize: vertical; border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; background: var(--surface); }
input[type="text"] { width: 100%; min-height: 46px; border: 2px solid var(--line); border-radius: 14px; padding: 0 12px; background: var(--surface); }
.rate { display: grid; gap: 6px; }
.rate input { width: 100%; accent-color: var(--lilac); }
.rate .ends { display: flex; justify-content: space-between; font: 700 12px/1.2 var(--body); color: var(--ink-dim); }
.rate output { font: 900 18px/1 var(--display); }
.near { position: relative; width: 100%; max-width: 100%; aspect-ratio: 1 / .62; border: 2px solid var(--line); border-radius: 24px; overflow: hidden; background: radial-gradient(80% 80% at 50% 40%, var(--sky-1), var(--sky-2)); box-shadow: 3px 3px 0 var(--shadow); }
.near .stars { position: absolute; inset: 0; width: 100%; height: 100%; }
.near .sun { position: absolute; left: 50%; top: 50%; width: 34%; transform: translate(-50%, -50%); transition: left .8s cubic-bezier(.3,1.3,.5,1), filter .6s; filter: saturate(.35) brightness(.65); }
.near .sun svg { width: 100%; display: block; }
.near .part { position: absolute; left: 50%; top: 50%; width: 36%; transform: translate(-50%, -50%); transition: left .8s cubic-bezier(.3,1.3,.5,1), width .8s; }
.near .part img { width: 100%; max-height: 120px; object-fit: contain; display: block; filter: drop-shadow(0 8px 8px rgba(0,0,0,.4)); }
.near.apart .sun { left: 34%; filter: none; }
.near.apart .part { left: 74%; width: 28%; }
.near .tag { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); font: 800 12px/1 var(--display); color: var(--on-sky); background: rgba(20,16,44,.75); border: 0; padding: 6px 10px; border-radius: 999px; white-space: nowrap; }
.breaths { display: flex; gap: 8px; justify-content: center; }
.breaths i { width: 40px; height: 14px; border-radius: 8px; border: 2px solid var(--line); background: var(--surface); transition: background .3s; }
.breaths i.on { background: var(--yellow); }
.say { font: 700 22px/1.15 var(--hand); color: var(--lilac-ink); text-align: center; }
.moves { display: grid; gap: 8px; }
.mv { text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; box-shadow: 3px 3px 0 var(--shadow); font: 700 14.5px/1.3 var(--body); }
.mv[aria-pressed="true"] { background: var(--yellow); color: var(--on-yellow); }
.shift { display: flex; gap: 12px; align-items: center; }
.shift b { font: 900 34px/1 var(--display); }

/* two skies */
.dock { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dock .col { display: grid; gap: 8px; align-content: start; min-width: 0; }
.dock .col h3 { font: 800 12px/1.2 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); }
.dock .it { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 8px; align-items: center; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 4px 8px 4px 4px; font: 800 11.5px/1.15 var(--display); min-width: 0; }
.dock .it svg.dd { width: 40px; height: 40px; }
.pair { border-left-width: 6px; border-left-color: var(--mint); }

/* practices */
.prc { display: grid; gap: 10px; border: 2px solid var(--line); border-radius: 22px; padding: 14px; box-shadow: 3px 3px 0 var(--shadow); }
.prc-head { display: grid; grid-template-columns: minmax(0, 1fr) 64px; gap: 12px; align-items: center; text-align: left; background: none; border: 0; padding: 0; }
.prc b { display: block; font: 900 18px/1.1 var(--display); }
.prc small { display: block; font-size: 13px; color: var(--ink-dim); margin-top: 4px; }
.prc svg.dd { width: 64px; height: 64px; }
.prc .btn { justify-self: start; }
.prc ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.prc.cat-calm { background: var(--t-mint); } .prc.cat-part { background: var(--t-lilac); } .prc.cat-two { background: var(--t-pink); } .prc.cat-soon { background: var(--t-yellow); }
.knotico { width: 64px; height: 64px; border-radius: 50%; background: var(--yellow); border: 2.5px solid var(--line); display: grid; place-items: center; }
.knotico svg { width: 38px; height: 38px; }

.toggle { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sw { position: relative; width: 52px; height: 30px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface-2); flex: none; padding: 0; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--ink); transition: left .2s; }
.sw[aria-checked="true"] { background: var(--mint); }
.sw[aria-checked="true"]::after { left: 25px; }
.me { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 12px; align-items: center; }
.me svg { width: 56px; height: 56px; }

.convo { display: grid; gap: 8px; }
.cv { max-width: 88%; padding: 9px 12px; border-radius: 16px; border: 2px solid var(--line); font-size: 13.5px; line-height: 1.35; background: var(--surface); }
.cv.part { justify-self: end; background: var(--t-lilac); }
.cv.part small { display: block; font: 800 10px/1.1 var(--body); text-transform: uppercase; letter-spacing: .05em; color: var(--lilac-ink); margin-bottom: 3px; }
.cv.part span { font: 700 19px/1.15 var(--hand); }

/* tab bar: five slots, the centre one raised */
#tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 2px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
#tabs .in { max-width: 460px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: end; }
#tabs button { background: none; border: 0; padding: 10px 2px 12px; display: grid; justify-items: center; gap: 4px; font: 800 10.5px/1.1 var(--body); color: var(--ink-faint); min-width: 0; }
#tabs button[aria-current="page"] { color: var(--ink); }
#tabs button[aria-current="page"] > svg { color: var(--lilac-ink); }
#tabs svg { width: 24px; height: 24px; }
#tabs .knotbtn { padding-top: 0; color: var(--ink); }
#tabs .knotbtn .disc { width: 66px; height: 66px; margin-top: -26px; border-radius: 50%; background: var(--yellow); border: 2.5px solid var(--line); box-shadow: 0 4px 0 var(--shadow); display: grid; place-items: center; transition: transform .08s, box-shadow .08s; }
#tabs .knotbtn:active .disc { transform: translateY(3px); box-shadow: 0 1px 0 var(--shadow); }
#tabs .knotbtn .disc svg { width: 40px; height: 40px; color: #1C1830; }
#tabs .knotbtn[aria-current="page"] .disc { box-shadow: 0 4px 0 var(--shadow), 0 0 0 4px var(--t-lilac); }
.toast { position: fixed; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 8; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 12px; font: 700 13px/1.3 var(--body); max-width: calc(100% - 32px); }

        (p.knot ? '<span class="knotico">' + icon('ic-knot') + '</span>' : dd(p.dd)) + '</button>';
      if (open) {
        if (p.soon) h += '<div class="convo"><div class="cv">Спроси часть: что случится, если она перестанет решать за тебя?</div><div class="cv part"><small>ты — за часть</small><span>Тогда всё рухнет. Я держу всё на себе.</span></div><div class="cv">Чего она на самом деле хочет для тебя?</div></div>';
        else h += '<ol>' + steps.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ol>' +
          (p.knot ? '<button class="btn small" type="button" data-go="knot">Завязать узелок</button>' : '<button class="btn small" type="button" data-act="pr-done" data-id="' + p.id + '">Сделано</button>');
      }
      h += '</div>';
    });
    return h + '</div><p class="faint">«Карточка дня» с заданием для главной части ждёт на главной.</p>';
  };

  screens.stars = function () {
    var p = hasSky() ? top()[0] : 'later';
    var P = PARTS[p];
    return '<button class="link" type="button" data-go="profile">← Профиль</button><p class="kicker">' + esc(L('stars')) + ' · скоро</p><h1 class="h1">Найти своих</h1>' +
      '<p class="lede">Небольшие круги людей, у которых в небе живёт похожая часть. Раз в неделю — общее задание, без камер и без оценок.</p>' +
      '<div class="card"><div class="members">' + dd(p) + dd('enough') + dd('jester') + dd('pleaser') + '</div><h2 class="h2" style="margin-top:10px">Созвездие: ' + esc(P.short) + '</h2>' +
      '<ul style="margin:8px 0 0;padding-left:18px;display:grid;gap:5px" class="muted"><li>Каждую среду — общее задание на 25 минут</li><li>Здесь все свои: без стыда и сравнений</li><li>Правила круга и модерация</li></ul></div>' +
      (S.waitlist ? '<div class="card mint"><b>Ты в списке.</b> Мы напишем, если созвездие соберётся.</div>' : '<button class="btn" type="button" data-act="waitlist">Хочу в созвездие</button>') +
      '<p class="faint">Честно: мы пока проверяем, нужно ли это. Созвездия появятся, если они нужны. Твоё небо видно другим только с твоего согласия.</p>';
  };

  var resetArmed = false;
  screens.profile = function () {
    return '<h1 class="h1">Профиль</h1>' +
      '<div class="card me">' + sun + '<div><p class="h3">Гость</p><p class="faint">Ответы и узелки хранятся только в этом браузере.</p></div></div>' +
      '<div class="card stack"><p class="kicker">Оформление</p><div class="seg" role="group" aria-label="Режим"><button type="button" data-act="set-mode" data-id="light" aria-pressed="' + (S.mode !== 'sky') + '">' + icon('ic-day') + 'Светлый</button><button type="button" data-act="set-mode" data-id="sky" aria-pressed="' + (S.mode === 'sky') + '">' + icon('ic-moon') + 'Небо</button></div>' +
      '<p class="faint">Светлый — по умолчанию. «Небо» — тёмный режим: ночное небо, на котором живут твои части.</p></div>' +
      '<div class="card stack"><p class="kicker">Комфорт</p>' +
      '<div class="toggle"><span><b>Говорить проще</b><br><span class="faint">Без образов: «Мои части» вместо «Твоё небо», «Заметить» вместо «Узелок»</span></span><button class="sw" type="button" role="switch" aria-checked="' + S.plain + '" aria-label="Говорить проще" data-act="plain"></button></div>' +
      '<p class="faint">Звук выключен, пока ты его не включишь.</p></div>' +
      '<button class="card blue" type="button" data-go="stars" style="text-align:left;display:grid;gap:4px;width:100%"><span class="kicker">' + esc(L('stars')) + ' · скоро</span><span class="h3">Найти людей с похожими частями →</span></button>' +
      '<button class="link" type="button" data-go="how">Как это работает?</button>' +
      '<div class="card dash stack"><p class="kicker">Для интервью</p>' +
      '<button class="btn small" type="button" data-go="report">Отчёт для исследования</button>' +
      '<button class="btn small ghost" type="button" data-act="retake">Пройти тест заново</button>' +
      (resetArmed ? '<p class="muted">Стереть ответы, узелки и отметки в этом браузере?</p><div class="row"><button class="btn small" type="button" data-act="reset-yes">Да, стереть</button><button class="btn small ghost" type="button" data-act="reset-no">Отмена</button></div>' : '<button class="btn small ghost" type="button" data-act="reset">Сбросить прототип</button>') +
      '<p class="faint">Ссылки на экраны: добавь к адресу #test, #home, #knot, #sos, #parts, #two, #practices, #profile, #stars или #report.</p></div>';
  };

  /* Diary report: participants copy this and send it to the researcher on day 7 and day 14. Nothing leaves the browser on its own. */
  var reportText = function () {
    var dkStart = S.start ? new Date(S.start) : null;
    var checkDays = Object.keys(S.days).length;
    var lateCheck = dkStart ? Object.keys(S.days).some(function (k) { var p = k.split('-'); return (new Date(+p[0], +p[1] - 1, +p[2]) - new Date(dkStart.getFullYear(), dkStart.getMonth(), dkStart.getDate())) / 86400000 >= 6; }) : false;
    var shifts = S.moments.map(function (m) { return m.after - m.before; });
    var quick = S.knots.filter(function (k) { return k.kind !== 'sos'; });
    var lines = [
      'Innerverse · отчёт прототипа',
      'Код участника: ' + (S.code || '—'),
      'Начало: ' + (dkStart ? dkStart.toLocaleDateString('ru-RU') : '—') + ' · день ' + (dayIndex() + 1),
      'Небо: ' + (hasSky() ? top().map(function (p) { return PARTS[p].short; }).join(', ') : 'тест не пройден') + (S.cover ? ' · обложка: ' + S.cover : ''),
      'Дней с отметкой «Кто сегодня главный?»: ' + checkDays + ' · возвращение на 7-й день или позже: ' + (lateCheck ? 'да' : 'нет'),
      'Заданий сделано: ' + S.tasksDone,
      'Узелков: ' + quick.length + (quick.length ? ' (с частью: ' + quick.filter(function (k) { return k.part; }).length + ')' : ''),
      'Моментов «Накрыло»: ' + S.moments.length + (shifts.length ? ' · медиана сдвига: ' + (median(shifts) > 0 ? '+' : '') + median(shifts) : ''),
      'Приглашений скопировано: ' + S.shares,
      'Режим: ' + (S.mode === 'sky' ? 'небо' : 'светлый') + ' · Plus: ' + (S.plus ? (S.plus === 'yes' ? 'оформить' : 'не сейчас') + ' (' + S.plusPrice + ' ₽)' : 'не показан') + ' · созвездия: ' + (S.waitlist ? 'в списке' : 'нет')
    ];
    S.moments.forEach(function (m, i) { lines.push('Момент ' + (i + 1) + ': ' + (m.part ? PARTS[m.part].short : 'не знаю') + ', ' + m.before + '→' + m.after + ', шаг: ' + m.move); });
    return lines.join('\n');
  };
  screens.report = function () {
    return '<button class="link" type="button" data-go="profile">← Профиль</button><p class="kicker">Для исследования</p><h1 class="h2">Отчёт для исследователя</h1>' +
      '<p class="muted">Скопируй текст и отправь исследователю на 7-й и 14-й день. Здесь только счётчики и выбранные шаги, без текстов узелков и без того, что случилось.</p>' +
      '<label class="faint" for="code">Твой код участника (например, P07)</label><input type="text" id="code" maxlength="12" value="' + esc(S.code) + '">' +
      '<textarea id="report" readonly style="min-height:240px;font-size:13px">' + esc(reportText()) + '</textarea>' +
      '<button class="btn" type="button" data-act="copy" data-target="report">Скопировать отчёт</button>';
  };

  /* Router */
  var current = '', prev = 'home';
  var partId = null;
  var TABS = [['home', 'ic-home'], ['parts', 'ic-parts'], ['knot', 'ic-knot'], ['practices', 'ic-practice'], ['profile', 'ic-me']];
  var TAB_OF = { welcome: 'home', home: 'home', result: 'home', share: 'home', how: 'home', parts: 'parts', part: 'parts', two: 'parts', 'two-sample': 'parts', knot: 'knot', practices: 'practices', profile: 'profile', stars: 'profile', report: 'profile' };
  var renderTabs = function (name) {
    var base = TAB_OF[name];
    tabs.querySelector('.in').innerHTML = TABS.map(function (t) {
      var cur = base === t[0] ? ' aria-current="page"' : '';
      if (t[0] === 'knot') return '<button type="button" class="knotbtn" data-go="knot"' + cur + '><span class="disc">' + icon(t[1]) + '</span>' + esc(L('knot')) + '</button>';
      return '<button type="button" data-go="' + t[0] + '"' + cur + '>' + icon(t[1]) + esc(L(t[0])) + '</button>';
    }).join('');
  };
  var go = function (name, opts) {
    opts = opts || {};
    if (name === 'home' && !hasSky()) name = 'welcome';
    if ((name === 'result' || name === 'share') && !hasSky()) name = 'test';
    if (name !== current && name !== 'part') prev = current || 'home';
    current = name;
    var html = name === 'part' ? screens.part(partId) : name === 'two-sample' ? screens.two(true) : (screens[name] || screens.welcome)();
    view.innerHTML = html;
    tabs.hidden = name === 'test' || name === 'sos';
    if (!tabs.hidden) renderTabs(name);
    if (!opts.keepScroll) window.scrollTo(0, 0);
    var token = { welcome: '', 'two-sample': 'two', part: 'parts' }[name];
    token = token === undefined ? name : token;
    try { if (location.hash.slice(1) !== token) history.replaceState(null, '', token ? '#' + token : location.pathname + location.search); } catch (e) {}
    bindInputs();
  };

  var bindInputs = function () {
    var cover = document.getElementById('cover');
    if (cover) cover.addEventListener('input', function () { S.cover = cover.value.trim(); save(); });
    ['before', 'after'].forEach(function (k) {
      var el = document.getElementById(k);
      if (el) el.addEventListener('input', function () { sos[k] = +el.value; document.getElementById(k + '-out').textContent = el.value; });
    });
    var code = document.getElementById('code');
    if (code) code.addEventListener('input', function () { S.code = code.value.trim(); save(); document.getElementById('report').value = reportText(); });
    var what = document.getElementById('sos-what');
    if (what) what.addEventListener('input', function () { sos.what = what.value; });
    var note = document.getElementById('kn-note');
    if (note) note.addEventListener('input', function () { kn.note = note.value; });
  };

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act],[data-go]');
    if (!el) return;
    if (el.dataset.go) { if (el.dataset.go === 'knot') kn = kn || null; go(el.dataset.go); return; }
    var a = el.dataset.act, id = el.dataset.id;
    if (a === 'start') { if (hasSky()) S.answers = []; save(); go('test'); }
    else if (a === 'answer') { S.answers.push(+el.dataset.i); if (hasSky() && !S.start) S.start = Date.now(); save(); go(S.answers.length >= SCENES.length ? 'result' : 'test'); }
    else if (a === 'back') { if (current === 'test') { S.answers.pop(); save(); go('test'); } else go(prev && prev !== 'part' ? prev : 'parts'); }
    else if (a === 'back-home') go('home');
    else if (a === 'share') go('share');
    else if (a === 'copy') {
      var ta = document.getElementById(el.dataset.target);
      var done = function () { toast('Скопировано'); };
      if (el.dataset.target !== 'report') { S.shares++; save(); }
      var fallback = function () { ta.focus(); ta.select(); toast('Выделено — скопируй вручную'); };
      try { navigator.clipboard.writeText(ta.value).then(done, fallback); } catch (err) { fallback(); }
    }
    else if (a === 'part') { partId = id; go('part'); }
    else if (a === 'mode') { S.mode = S.mode === 'sky' ? 'light' : 'sky'; save(); applyMode(); if (current === 'profile') go('profile', { keepScroll: true }); }
    else if (a === 'set-mode') { S.mode = id; save(); applyMode(); go('profile', { keepScroll: true }); }
    else if (a === 'more-today') { var m = document.getElementById('more-today'); m.hidden = !m.hidden; }
    else if (a === 'today') { S.today = { day: dayKey(), part: id, task: 0, done: false }; S.days[dayKey()] = true; act(id); save(); go('home', { keepScroll: true }); }
    else if (a === 'other-task') { S.today.task++; save(); go('home', { keepScroll: true }); }
    else if (a === 'done') { S.today.done = true; S.tasksDone++; act(S.today.part); save(); go('home', { keepScroll: true }); toast('Отмечено'); }
    else if (a === 'plus-yes' || a === 'plus-no') { S.plus = a === 'plus-yes' ? 'yes' : 'no'; save(); go('home', { keepScroll: true }); toast(S.plus === 'yes' ? 'Спасибо! Оплаты в прототипе нет — мы учтём твой ответ.' : 'Хорошо. Всё бесплатное остаётся с тобой.'); }
    else if (a === 'knot-part') { kn = { feel: null, body: [], part: id, note: '' }; go('knot'); }
    else if (a === 'kn-feel') { kn.feel = kn.feel === id ? null : id; go('knot', { keepScroll: true }); }
    else if (a === 'kn-body') { var bi = kn.body.indexOf(id); if (bi >= 0) kn.body.splice(bi, 1); else kn.body.push(id); go('knot', { keepScroll: true }); }
    else if (a === 'kn-part') { kn.part = kn.part === id ? null : id; go('knot', { keepScroll: true }); }
    else if (a === 'kn-save') {
      if (!kn.feel) return;
      S.knots.push({ t: Date.now(), kind: 'knot', feel: kn.feel, body: kn.body.slice(), part: kn.part || null, note: (kn.note || '').trim() });
      act(kn.part); save(); kn = null; go('knot', { keepScroll: true }); toast('Узелок завязан');
    }
    else if (a === 'sos-open') { sos = null; go('sos'); }
    else if (a === 'sos-new') { var sm = document.getElementById('sos-more'); sm.hidden = !sm.hidden; }
    else if (a === 'sos-part') { sos.part = id || null; sos.what = (document.getElementById('sos-what') || {}).value || ''; sos.step = 'near'; go('sos'); }
    else if (a === 'apart') { sos.apart = true; go('sos', { keepScroll: true }); }
    else if (a === 'breath') { sos.breaths++; go('sos', { keepScroll: true }); }
    else if (a === 'to-move') { sos.step = 'move'; go('sos'); }
    else if (a === 'move') { sos.move = el.textContent; Array.prototype.forEach.call(document.querySelectorAll('.mv'), function (b) { b.setAttribute('aria-pressed', String(b === el)); }); }
    else if (a === 'save-moment') {
      var own = (document.getElementById('own-move').value || '').trim();
      if (own) sos.move = own;
      if (!sos.move) { toast('Выбери шаг или напиши свой'); return; }
      S.moments.push({ when: whenNow(), part: sos.part, before: sos.before, after: sos.after, move: sos.move, what: sos.what });
      S.knots.push({ t: Date.now(), kind: 'sos', part: sos.part, before: sos.before, after: sos.after, move: sos.move });
      act(sos.part); save(); sos.step = 'done'; go('sos');
    }
    else if (a === 'sos-close') { sos = null; go('knot'); }
    else if (a === 'pr-filter') { prFilter = id; prOpen = null; go('practices', { keepScroll: true }); }
    else if (a === 'pr-open') { prOpen = prOpen === id ? null : id; go('practices', { keepScroll: true }); }
    else if (a === 'pr-done') { var pp = PRACTICES.filter(function (p) { return p.id === id; })[0]; S.tasksDone++; act(pp && pp.part); save(); prOpen = null; go('practices', { keepScroll: true }); toast('Отмечено'); }
    else if (a === 'waitlist') { S.waitlist = true; save(); go('stars', { keepScroll: true }); }
    else if (a === 'plain') { S.plain = !S.plain; save(); go('profile', { keepScroll: true }); }
    else if (a === 'retake') { S.answers = []; save(); go('test'); }
    else if (a === 'reset') { resetArmed = true; go('profile', { keepScroll: true }); }
    else if (a === 'reset-no') { resetArmed = false; go('profile', { keepScroll: true }); }
    else if (a === 'reset-yes') { resetArmed = false; var keepMode = S.mode; S = blank(); S.mode = keepMode; save(); sos = null; kn = null; go('welcome'); }
  });

  /* Old links (#sky, #luna) from the first round of interviews still open the right place. */
  var ALIAS = { sky: 'home', luna: 'profile' };
  var fromHash = function () {
    var h = location.hash.slice(1);
    h = ALIAS[h] || h;
    var ok = ['test', 'result', 'share', 'home', 'how', 'knot', 'sos', 'parts', 'two', 'practices', 'profile', 'stars', 'report'];
    if (ok.indexOf(h) >= 0) { if (h === 'sos') sos = null; go(h); }
    else go(hasSky() ? 'home' : 'welcome');
  };
  applyMode();
  window.addEventListener('hashchange', fromHash);
  fromHash();
})();
</script>
