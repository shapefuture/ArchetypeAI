<title>Innerverse Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;800;900&family=Onest:wght@400;500;600;700;800&family=Caveat:wght@600&display=swap">
<style>
/* Layout: one phone-width column, a night-sky scene at the top of each space, felt stickers, a fixed SOS button. Tokens follow the v2 deck. */
:root {
  --bg: #FBF4E6; --surface: #FFFFFF; --surface-2: #F3EAD8; --ink: #1C1830; --ink-dim: rgba(28,24,48,.74); --ink-faint: rgba(28,24,48,.56);
  --line: #1C1830; --soft: rgba(28,24,48,.14); --shadow: #1C1830;
  --yellow: #FFD43B; --on-yellow: #1C1830; --lilac: #8E6CFF; --lilac-ink: #5A3FD1; --lilac-soft: #E9E2FF; --mint: #3DCB8E; --mint-soft: #DDF6EA;
  --pink: #FF6FA8; --red: #E5484D; --red-soft: #FDE2E2;
  --sky-1: #2A2160; --sky-2: #1A1540; --on-sky: #F4ECDE; --on-sky-dim: rgba(244,236,222,.72);
  --display: 'Rubik', 'Arial Black', system-ui, sans-serif;
  --body: 'Onest', 'Segoe UI', Roboto, system-ui, sans-serif;
  --hand: 'Caveat', 'Segoe Print', cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15122B; --surface: #221C42; --surface-2: #2C2553; --ink: #F4ECDE; --ink-dim: rgba(244,236,222,.78); --ink-faint: rgba(244,236,222,.58);
    --line: rgba(244,236,222,.55); --soft: rgba(244,236,222,.16); --shadow: rgba(0,0,0,.55);
    --lilac-ink: #B9A6FF; --lilac-soft: #2F2760; --mint-soft: #173A2E; --red-soft: #3A1D2A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15122B; --surface: #221C42; --surface-2: #2C2553; --ink: #F4ECDE; --ink-dim: rgba(244,236,222,.78); --ink-faint: rgba(244,236,222,.58);
  --line: rgba(244,236,222,.55); --soft: rgba(244,236,222,.16); --shadow: rgba(0,0,0,.55);
  --lilac-ink: #B9A6FF; --lilac-soft: #2F2760; --mint-soft: #173A2E; --red-soft: #3A1D2A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--lilac); outline-offset: 3px; border-radius: 8px; }
img { max-width: 100%; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }

.app { max-width: 460px; margin: 0 auto; min-height: 100vh; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px)); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 12px 10px; }
.brand { font: 900 17px/1 var(--display); letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.brand svg { width: 26px; height: 26px; }
.proto { font: 700 11px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); border: 1.5px dashed var(--soft); border-radius: 999px; padding: 6px 9px; }

#view { display: grid; gap: 16px; padding-top: 4px; }
.kicker { font: 800 11.5px/1.2 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--lilac-ink); }
.h1 { font: 900 clamp(30px, 8vw, 38px)/1.02 var(--display); letter-spacing: -.02em; }
.h2 { font: 900 22px/1.1 var(--display); letter-spacing: -.01em; }
.lede { color: var(--ink-dim); font-size: 16px; }
.muted { color: var(--ink-dim); }
.faint { color: var(--ink-faint); font-size: 13px; }
.hand { font: 600 20px/1.15 var(--hand); color: var(--lilac-ink); }
.stack { display: grid; gap: 10px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

.card { background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 16px; box-shadow: 3px 3px 0 var(--shadow); min-width: 0; }
.card.soft { background: var(--lilac-soft); }
.card.mint { background: var(--mint-soft); }
.card.warm { background: color-mix(in srgb, var(--yellow) 26%, var(--surface)); }
.card.dash { border-style: dashed; box-shadow: none; background: var(--surface-2); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 18px; border: 2.5px solid var(--line); border-radius: 18px; background: var(--yellow); color: var(--on-yellow); font: 900 16px/1 var(--display); box-shadow: 0 5px 0 var(--shadow); transition: transform .08s, box-shadow .08s; width: 100%; }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--shadow); }
.btn.ghost { background: var(--surface); color: var(--ink); }
.btn.lilac { background: var(--lilac); color: #fff; }
.btn.small { min-height: 40px; font-size: 14px; border-radius: 14px; width: auto; box-shadow: 0 3px 0 var(--shadow); }
.btn[disabled] { opacity: .5; cursor: default; }
.link { background: none; border: 0; padding: 6px 0; font: 700 14px/1.2 var(--body); color: var(--lilac-ink); text-decoration: underline; text-underline-offset: 3px; justify-self: start; }

/* sky scene */
.sky { position: relative; width: 100%; max-width: 100%; aspect-ratio: 1 / .78; border: 2px solid var(--line); border-radius: 26px; overflow: hidden; background: radial-gradient(80% 70% at 50% 45%, var(--sky-1), var(--sky-2)); box-shadow: 4px 4px 0 var(--shadow); }
.sky .stars { position: absolute; inset: 0; width: 100%; height: 100%; }
.sky .sun { position: absolute; left: 50%; top: 46%; width: 30%; transform: translate(-50%, -50%); transition: filter .6s; }
.sky .sun svg { width: 100%; height: auto; display: block; }
.sky .pt { position: absolute; width: 24%; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 2px; background: none; border: 0; padding: 0; color: var(--on-sky); }
.sky .pt img { width: 100%; filter: drop-shadow(0 6px 6px rgba(0,0,0,.35)); }
.sky .pt span { font: 800 10.5px/1.15 var(--display); text-align: center; background: rgba(20,16,44,.72); padding: 3px 7px; border-radius: 999px; max-width: 120%; }
.sky .cover { position: absolute; right: 10px; top: 10px; font: 700 11px/1 var(--body); color: var(--on-sky); border: 1.5px dashed rgba(244,236,222,.6); border-radius: 999px; padding: 6px 9px; }
.sky .luna { position: absolute; left: 8px; top: 6px; width: 17%; }

/* test */
.prog { height: 10px; border: 2px solid var(--line); border-radius: 6px; background: var(--surface); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--lilac); transition: width .3s; }
.scene { font-size: 14px; color: var(--ink-dim); }
.ask { font: 900 22px/1.12 var(--display); margin-top: 6px; }
.answers { display: grid; gap: 10px; }
.ans { display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center; text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 8px 12px 8px 8px; box-shadow: 3px 3px 0 var(--shadow); font: 600 14.5px/1.35 var(--body); }
.ans img { width: 52px; height: 52px; object-fit: contain; }
.ans:hover { background: var(--surface-2); }

/* lists */
.plist { display: grid; gap: 8px; }
.pr { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 6px 10px 6px 6px; box-shadow: 3px 3px 0 var(--shadow); width: 100%; }
.pr img { width: 52px; height: 52px; object-fit: contain; }
.pr b { display: block; font: 800 14px/1.2 var(--display); }
.pr small { display: block; font-size: 12px; color: var(--ink-faint); }
.stage { font: 800 10.5px/1 var(--body); padding: 5px 8px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface-2); white-space: nowrap; }
.stage.s2 { background: var(--lilac-soft); } .stage.s3 { background: color-mix(in srgb, var(--yellow) 45%, var(--surface)); } .stage.s4, .stage.s5 { background: var(--mint-soft); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: grid; justify-items: center; gap: 4px; width: calc(33.33% - 6px); min-width: 0; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 8px 4px; box-shadow: 2px 2px 0 var(--shadow); font: 800 11px/1.15 var(--display); text-align: center; }
.chip img { width: 54px; height: 54px; object-fit: contain; }
.chip .q { width: 54px; height: 54px; display: grid; place-items: center; font: 900 24px/1 var(--display); border: 2px dashed var(--line); border-radius: 50%; }
.chip[aria-pressed="true"] { background: var(--yellow); color: var(--on-yellow); }

.daycard { display: grid; grid-template-columns: 84px 1fr; gap: 14px; align-items: start; }
.daycard img { width: 84px; }
.task { font: 800 17px/1.25 var(--display); margin-top: 6px; }
.moon { display: flex; gap: 6px; justify-content: space-between; margin-top: 8px; }
.moon span { display: grid; justify-items: center; gap: 4px; font: 700 10.5px/1 var(--body); color: var(--ink-faint); flex: 1; }
.moon i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface-2); }
.moon i.on { background: var(--yellow); box-shadow: inset -6px 0 0 color-mix(in srgb, var(--yellow) 55%, #B88A00); }

/* part page */
.hero { display: grid; place-items: center; height: 170px; border: 2px solid var(--line); border-radius: 24px; background: radial-gradient(70% 70% at 50% 70%, var(--sky-1), var(--sky-2)); box-shadow: 3px 3px 0 var(--shadow); }
.hero img { width: 128px; filter: drop-shadow(0 10px 8px rgba(0,0,0,.4)); }
.arc { display: flex; gap: 4px; }
.arc i { flex: 1; height: 10px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--surface); }
.arc i.on { background: var(--yellow); }
.arc-l { display: flex; justify-content: space-between; font: 700 10.5px/1 var(--body); color: var(--ink-faint); margin-top: 5px; }
.sec b { display: block; font: 800 13px/1.2 var(--display); margin-bottom: 2px; }

/* SOS */
.steps { display: flex; gap: 6px; flex-wrap: wrap; }
.steps span { font: 800 11px/1 var(--body); padding: 6px 9px; border-radius: 999px; border: 1.5px solid var(--soft); color: var(--ink-faint); }
.steps span.on { border-color: var(--line); background: var(--yellow); color: var(--on-yellow); }
.steps span.done { color: var(--ink); border-color: var(--line); }
textarea { width: 100%; min-height: 64px; resize: vertical; border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; background: var(--surface); }
input[type="text"] { width: 100%; min-height: 46px; border: 2px solid var(--line); border-radius: 14px; padding: 0 12px; background: var(--surface); }
.rate { display: grid; gap: 6px; }
.rate input { width: 100%; accent-color: var(--lilac); }
.rate .ends { display: flex; justify-content: space-between; font: 700 12px/1.2 var(--body); color: var(--ink-dim); }
.rate output { font: 900 18px/1 var(--display); }

.near { position: relative; width: 100%; max-width: 100%; aspect-ratio: 1 / .62; border: 2px solid var(--line); border-radius: 24px; overflow: hidden; background: radial-gradient(80% 80% at 50% 40%, var(--sky-1), var(--sky-2)); box-shadow: 3px 3px 0 var(--shadow); }
.near .stars { position: absolute; inset: 0; width: 100%; height: 100%; }
.near .sun { position: absolute; left: 50%; top: 50%; width: 34%; transform: translate(-50%, -50%); transition: left .8s cubic-bezier(.3,1.3,.5,1), filter .6s; filter: saturate(.35) brightness(.65); }
.near .sun svg { width: 100%; display: block; }
.near .part { position: absolute; left: 50%; top: 50%; width: 36%; transform: translate(-50%, -50%); transition: left .8s cubic-bezier(.3,1.3,.5,1), width .8s; }
.near .part img { width: 100%; display: block; filter: drop-shadow(0 8px 8px rgba(0,0,0,.4)); }
.near.apart .sun { left: 34%; filter: none; }
.near.apart .part { left: 74%; width: 28%; }
.near .tag { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); font: 800 12px/1 var(--display); color: var(--on-sky); background: rgba(20,16,44,.75); padding: 6px 10px; border-radius: 999px; white-space: nowrap; }
.breaths { display: flex; gap: 8px; justify-content: center; }
.breaths i { width: 40px; height: 14px; border-radius: 8px; border: 2px solid var(--line); background: var(--surface); transition: background .3s; }
.breaths i.on { background: var(--yellow); }
.say { font: 600 21px/1.2 var(--hand); color: var(--lilac-ink); text-align: center; }
.moves { display: grid; gap: 8px; }
.mv { text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; box-shadow: 3px 3px 0 var(--shadow); font: 700 14.5px/1.3 var(--body); }
.mv[aria-pressed="true"] { background: var(--yellow); color: var(--on-yellow); }
.shift { display: flex; gap: 12px; align-items: center; }
.shift b { font: 900 34px/1 var(--display); }

/* two skies */
.dock { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dock .col { display: grid; gap: 8px; align-content: start; }
.dock .col h3 { font: 800 12px/1.2 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); }
.dock .it { display: grid; grid-template-columns: 40px 1fr; gap: 8px; align-items: center; background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px 4px 4px; font: 800 11.5px/1.15 var(--display); min-width: 0; }
.dock .it img { width: 40px; height: 40px; object-fit: contain; }
.pair { border-left: 6px solid var(--mint); }
.pair.clash { border-left-color: var(--red); background: var(--red-soft); }
.pair b { display: block; font: 900 14px/1.25 var(--display); }
.pair .say2 { margin-top: 6px; font: 600 18px/1.15 var(--hand); color: var(--lilac-ink); }
.example { font: 800 11px/1 var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--red); }

.members { display: flex; }
.members img { width: 46px; height: 46px; object-fit: contain; margin-right: -8px; }

.toggle { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sw { position: relative; width: 52px; height: 30px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface-2); flex: none; padding: 0; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--ink); transition: left .2s; }
.sw[aria-checked="true"] { background: var(--mint); }
.sw[aria-checked="true"]::after { left: 25px; }

.convo { display: grid; gap: 8px; }
.cv { max-width: 88%; padding: 9px 12px; border-radius: 16px; border: 2px solid var(--line); font-size: 13.5px; line-height: 1.35; background: var(--surface); }
.cv.part { justify-self: end; background: var(--lilac-soft); }
.cv.part small { display: block; font: 800 10px/1.1 var(--body); text-transform: uppercase; letter-spacing: .05em; color: var(--lilac-ink); margin-bottom: 3px; }
.cv.part span { font: 600 18px/1.15 var(--hand); }

/* fixed chrome */
#tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 2px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
#tabs .in { max-width: 460px; margin: 0 auto; display: flex; justify-content: space-around; }
#tabs button { flex: 1; background: none; border: 0; padding: 10px 2px 12px; display: grid; justify-items: center; gap: 4px; font: 800 10.5px/1.1 var(--body); color: var(--ink-faint); }
#tabs button[aria-current="page"] { color: var(--ink); }
#tabs button[aria-current="page"] svg { color: var(--lilac-ink); }
#tabs svg { width: 24px; height: 24px; }
#sos { position: fixed; z-index: 7; right: max(16px, calc(50% - 214px), env(safe-area-inset-right, 0px)); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); min-height: 52px; padding: 0 18px; border: 2.5px solid var(--line); border-radius: 999px; background: var(--pink); color: #1C1830; font: 900 16px/1 var(--display); box-shadow: 0 5px 0 var(--shadow); }
#sos:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--shadow); }
.toast { position: fixed; left: 50%; bottom: calc(140px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 8; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 12px; font: 700 13px/1.3 var(--body); max-width: calc(100% - 32px); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}
</style>

<div class="app">
  <header class="bar">
    <div class="brand"><svg viewBox="0 0 120 120" aria-hidden="true"><use href="#sym-sun"/></svg>Innerverse</div>
    <span class="proto">прототип</span>
  </header>
  <main id="view" aria-live="polite"></main>
</div>
<button id="sos" type="button" hidden>Накрыло</button>
<nav id="tabs" aria-label="Разделы" hidden><div class="in"></div></nav>

<script>
(function () {
  var IMG = {
    p34: '{{S34}}', p29: '{{S29}}', p26: '{{S26}}', p36: '{{S36}}', p18: '{{S18}}', p14: '{{S14}}', p01: '{{S01}}',

  screens.two = function (sample) {

    });

    return h;
  };

  /* Router */

  var renderTabs = function (name) {
    var base = name === 'two-sample' ? 'two' : name === 'part' ? 'sky' : name;
    tabs.querySelector('.in').innerHTML = TABS.map(function (t) {
      return '<button type="button" data-go="' + t[0] + '"' + (base === t[0] ? ' aria-current="page"' : '') + '><svg aria-hidden="true"><use href="#' + t[1] + '"/></svg>' + esc(L(t[0])) + '</button>';
    }).join('');

  var go = function (name, opts) {
    opts = opts || {};
    if (name === 'sky' && !hasSky()) name = 'welcome';
    if ((name === 'result' || name === 'share') && !hasSky()) name = hasSky() ? name : 'test';
    current = name;
    var html = name === 'part' ? screens.part(partId) : name === 'two-sample' ? screens.two(true) : (screens[name] || screens.welcome)();
    view.innerHTML = html;
    var inFlow = name === 'welcome' || name === 'test';
    tabs.hidden = inFlow || name === 'sos';
    sosBtn.hidden = inFlow || name === 'sos';
    if (!tabs.hidden) renderTabs(name);
    if (!opts.keepScroll) window.scrollTo(0, 0);
    var token = { welcome: '', 'two-sample': 'two', part: 'sky' }[name];
    token = token === undefined ? name : token;
    try { if (location.hash.slice(1) !== token) history.replaceState(null, '', token ? '#' + token : location.pathname + location.search); } catch (e) {}

  var bindInputs = function () {
    var cover = document.getElementById('cover');
    if (cover) cover.addEventListener('input', function () { S.cover = cover.value.trim(); save(); });
    ['before', 'after'].forEach(function (k) {
      var el = document.getElementById(k);
      if (el) el.addEventListener('input', function () { sos[k] = +el.value; document.getElementById(k + '-out').textContent = el.value; });
    });
    var what = document.getElementById('sos-what');
    if (what) what.addEventListener('input', function () { sos.what = what.value; });
  };

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act],[data-go]');
    if (!el) return;
    if (el.dataset.go) { go(el.dataset.go); return; }
    var a = el.dataset.act, id = el.dataset.id;
    if (a === 'start') { if (hasSky()) S.answers = []; save(); go('test'); }
    else if (a === 'answer') { S.answers.push(+el.dataset.i); save(); go(S.answers.length >= SCENES.length ? 'result' : 'test'); }
    else if (a === 'back') { S.answers.pop(); save(); go('test'); }
    else if (a === 'share') go('share');
    else if (a === 'copy') {
      var ta = document.getElementById(el.dataset.target);
      var done = function () { toast('Скопировано'); };
      var fallback = function () { ta.focus(); ta.select(); toast('Выделено — скопируйте вручную'); };
      try { navigator.clipboard.writeText(ta.value).then(done, fallback); } catch (err) { fallback(); }
    }
    else if (a === 'part') { partId = id; go('part'); }
    else if (a === 'back-sky') go('sky');
    else if (a === 'more-today') { var m = document.getElementById('more-today'); m.hidden = !m.hidden; }
    else if (a === 'today') { S.today = { day: dayKey(), part: id, task: 0, done: false }; S.days[dayKey()] = true; act(id); save(); go('sky', { keepScroll: true }); }
    else if (a === 'other-task') { S.today.task++; save(); go('sky', { keepScroll: true }); }
    else if (a === 'done') { S.today.done = true; act(S.today.part); save(); go('sky', { keepScroll: true }); toast('Отмечено'); }
    else if (a === 'sos-new') { var sm = document.getElementById('sos-more'); sm.hidden = !sm.hidden; }
    else if (a === 'sos-part') { sos.part = id || null; sos.what = (document.getElementById('sos-what') || {}).value || ''; sos.step = 'near'; go('sos'); }
    else if (a === 'apart') { sos.apart = true; go('sos', { keepScroll: true }); }
    else if (a === 'breath') { sos.breaths++; go('sos', { keepScroll: true }); }
    else if (a === 'to-move') { sos.step = 'move'; go('sos'); }
    else if (a === 'move') { sos.move = el.textContent; Array.prototype.forEach.call(document.querySelectorAll('.mv'), function (b) { b.setAttribute('aria-pressed', String(b === el)); }); }
    else if (a === 'save-moment') {
      var own = (document.getElementById('own-move').value || '').trim();
      if (own) sos.move = own;
      if (!sos.move) { toast('Выберите шаг или напишите свой'); return; }
      S.moments.push({ when: new Date().toLocaleString('ru-RU', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }), part: sos.part, before: sos.before, after: sos.after, move: sos.move, what: sos.what });
      act(sos.part); save(); sos.step = 'done'; go('sos');
    }
    else if (a === 'sos-close') { sos = null; go(hasSky() ? 'sky' : 'welcome'); }
    else if (a === 'waitlist') { S.waitlist = true; save(); go('stars', { keepScroll: true }); }
    else if (a === 'plain') { S.plain = !S.plain; save(); go('luna', { keepScroll: true }); }
    else if (a === 'theme') {
      var t = document.documentElement.dataset.theme;
      var next = t === 'dark' ? 'light' : t === 'light' ? '' : 'dark';
      if (next) document.documentElement.dataset.theme = next; else delete document.documentElement.dataset.theme;
      document.getElementById('theme-name').textContent = themeName();
    }
    else if (a === 'retake') { S.answers = []; save(); go('test'); }
    else if (a === 'reset') { resetArmed = true; go('luna', { keepScroll: true }); }
    else if (a === 'reset-no') { resetArmed = false; go('luna', { keepScroll: true }); }
    else if (a === 'reset-yes') { resetArmed = false; S = blank(); save(); sos = null; go('welcome'); }
  });

  sosBtn.addEventListener('click', function () { sos = null; go('sos'); });

  var fromHash = function () {
    var h = location.hash.slice(1);
    var ok = ['test', 'result', 'share', 'sky', 'sos', 'two', 'stars', 'luna'];
    if (ok.indexOf(h) >= 0) { if (h === 'sos') sos = null; go(h); }
    else go(hasSky() ? 'sky' : 'welcome');
  };
  window.addEventListener('hashchange', fromHash);
  fromHash();
})();
</script>
