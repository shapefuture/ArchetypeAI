<meta charset="utf-8">
<title>Innerverse Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;800;900&family=Onest:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap">
<!--@css app/styles.css-->
{{DOODLES}}
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <!-- A flat sun for the brand mark: ink outline, no glow. -->
    <symbol id="sym-sun" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="34" fill="#FFD43B" stroke="#1C1830" stroke-width="5"/>
      <g stroke="#1C1830" stroke-width="5" stroke-linecap="round"><path d="M60 8v12M60 100v12M8 60h12M100 60h12M22 22l8 8M90 90l8 8M98 22l-8 8M30 90l-8 8"/></g>
    </symbol>
    <!-- Ariadne's thread: three rings with gaps, one red thread to a knot at the centre. -->
    <symbol id="ic-knot" viewBox="0 0 32 32">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M13 28.65A13 13 0 1 1 19 28.65"/><path d="M18.5 7.35A9 9 0 1 1 13.5 7.35"/><path d="M14 20.58A5 5 0 1 1 18 20.58"/>
      </g>
      <path d="M16 32V27A11 11 0 0 1 5 16A11 11 0 0 1 16 5V9A7 7 0 0 1 23 16A7 7 0 0 1 16 23V17.6" fill="none" stroke="#E5484D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="16" cy="16" r="2.3" fill="#E5484D"/>
    </symbol>
  </defs>
</svg>

<div class="app">
  <header class="bar">
    <div class="brand"><svg viewBox="0 0 120 120" aria-hidden="true"><use href="#sym-sun"/></svg>Innerverse</div>
    <div class="bar-r"><span class="proto">прототип</span></div>
  </header>
  <main id="view" aria-live="polite"></main>
</div>
<nav id="tabs" aria-label="Разделы" hidden><div class="in">
  <button type="button" data-tab="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1Z"/></svg>Главная</button>
  <button type="button" data-tab="cabinet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8.5" r="3"/><circle cx="16" cy="8.5" r="3"/><circle cx="12" cy="16" r="3"/></svg>Части</button>
  <button type="button" data-tab="knots" class="knotbtn"><span class="disc"><svg viewBox="0 0 32 32" aria-hidden="true"><use href="#ic-knot"/></svg></span>Узелки</button>
  <button type="button" data-tab="practice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5c2.7-1.2 5.3-1.2 8 .5 2.7-1.7 5.3-1.7 8-.5v13c-2.7-1.2-5.3-1.2-8 .5-2.7-1.7-5.3-1.7-8-.5Z"/></svg>Практика</button>
  <button type="button" data-tab="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.5" r="4"/><path d="M4.5 20.5c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5"/></svg>Ты</button>
</div></nav>
<div class="toast" id="toast" role="status" hidden></div>
<!--@js app/data.js-->
<!--@js app/copy.js-->
<!--@js app/app.js-->
<!--@js app/therapist.js-->
