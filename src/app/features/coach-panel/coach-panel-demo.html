<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Coach Panel - SIGGRAPH-Tier Storybook Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper-bg: #f6f3eb;
      --paper-panel: #fdfbf6;
      --ink-main: #4a3e35;
      --ink-muted: #8b7d72;
      --ink-light: #c2b7ad;
      --accent-blue: #70a1d7;
      --accent-orange: #f4a261;
      --border-sketchy: 2px solid var(--ink-main);
      --radius-sketchy: 255px 15px 225px 15px / 15px 225px 15px 255px;
      --shadow-float: 0 12px 24px rgba(74, 62, 53, 0.15);
      --shadow-card-sm: 2px 2px 0 rgba(200, 190, 180, 0.5);
      --font-serif: 'Fraunces', serif;
      --font-sans: 'Nunito', sans-serif;
      --ease-storybook: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-sans);
      background: var(--paper-bg);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .demo-container {
      text-align: center;
    }

    .demo-title {
      font-family: var(--font-serif);
      font-size: 36px;
      color: var(--ink-main);
      margin-bottom: 12px;
    }

    .demo-subtitle {
      font-size: 16px;
      color: var(--ink-muted);
      margin-bottom: 32px;
    }

    .toggle-btn {
      background: var(--accent-blue);
      color: white;
      border: 2px solid var(--ink-main);
      border-radius: 16px;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      font-family: var(--font-sans);
      box-shadow: 2px 2px 0 rgba(200, 190, 180, 0.5), 4px 4px 0 rgba(180, 170, 160, 0.3);
      transition: all 300ms var(--ease-storybook);
    }

    .toggle-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: var(--shadow-float);
    }

    /* Coach Panel Styles */
    .coach-panel {
      position: fixed;
      top: 0;
      right: -450px;
      width: 420px;
      height: 100dvh;
      background: var(--paper-panel);
      border-left: var(--border-sketchy);
      box-shadow: var(--shadow-float);
      display: flex;
      flex-direction: column;
      transition: right 500ms var(--ease-storybook);
      z-index: 1000;
    }

    .coach-panel.open {
      right: 0;
    }

    .coach-panel__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
      border-bottom: 2px solid var(--ink-light);
      background: linear-gradient(135deg, var(--paper-panel) 0%, rgba(112, 161, 215, 0.1) 100%);
    }

    .coach-panel__title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .owl-icon {
      width: 40px;
      height: 40px;
    }

    .coach-panel__title-text {
      font-family: var(--font-serif);
      font-size: 24px;
      font-weight: 700;
      color: var(--ink-main);
      margin: 0;
    }

    .coach-panel__close {
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 8px;
      border-radius: 16px;
      color: var(--ink-muted);
      transition: all 300ms ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .coach-panel__close:hover {
      background: rgba(74, 62, 53, 0.1);
      color: var(--ink-main);
      transform: scale(1.1);
    }

    .coach-panel__messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .coach-message {
      display: flex;
      gap: 12px;
      animation: messageSlideIn 300ms ease-out;
    }

    @keyframes messageSlideIn {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .coach-message__avatar {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
    }

    .coach-message__bubble {
      max-width: 280px;
      padding: 14px 18px;
      border-radius: var(--radius-sketchy);
      box-shadow: var(--shadow-card-sm);
    }

    .coach-message__bubble--coach {
      background: var(--paper-panel);
      border: var(--border-sketchy);
    }

    .coach-message__bubble--user {
      background: rgba(112, 161, 215, 0.15);
      border: 2px solid var(--accent-blue);
    }

    .coach-message__content {
      font-size: 14px;
      line-height: 1.6;
      color: var(--ink-main);
      word-wrap: break-word;
    }

    .coach-message__bubble--coach .coach-message__content {
      font-family: var(--font-serif);
      font-style: italic;
    }

    .coach-message__timestamp {
      font-size: 11px;
      color: var(--ink-light);
      margin-top: 8px;
      text-align: right;
      font-weight: 600;
    }

    .coach-panel__suggestions {
      padding: 16px 20px;
      border-top: 2px solid var(--ink-light);
      background: rgba(255, 255, 255, 0.3);
    }

    .coach-panel__suggestions-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-muted);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .coach-panel__suggestions-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .suggestion-chip {
      background: rgba(255, 249, 240, 0.8);
      border: 2px solid var(--accent-blue);
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-main);
      cursor: pointer;
      transition: all 300ms var(--ease-storybook);
      font-family: var(--font-sans);
    }

    .suggestion-chip:hover {
      transform: scale(1.05);
      background: rgba(112, 161, 215, 0.15);
    }

    .coach-panel__input {
      padding: 16px 20px;
      border-top: 2px solid var(--ink-light);
      background: var(--paper-panel);
    }

    .coach-panel__input-wrapper {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      background: rgba(255, 255, 255, 0.5);
      border: var(--border-sketchy);
      border-radius: var(--radius-sketchy);
      padding: 12px;
      box-shadow: inset 0 2px 4px rgba(74, 62, 53, 0.05);
    }

    .coach-panel__textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      color: var(--ink-main);
      resize: none;
      min-height: 24px;
      max-height: 120px;
      overflow-y: auto;
    }

    .coach-panel__textarea::placeholder {
      color: var(--ink-light);
      font-style: italic;
    }

    .coach-panel__input-wrapper:focus-within {
      box-shadow: inset 0 2px 4px rgba(74, 62, 53, 0.05), 0 0 0 3px rgba(112, 161, 215, 0.2);
    }

    .coach-panel__send {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      background: var(--accent-blue);
      border: 2px solid var(--ink-main);
      border-radius: 12px;
      color: white;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 300ms var(--ease-storybook);
    }

    .coach-panel__send:hover:not(:disabled) {
      transform: scale(1.05);
      background: #5a91c7;
    }

    .coach-panel__send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .typing-indicator {
      display: flex;
      gap: 6px;
      padding: 4px 0;
    }

    .typing-indicator__dot {
      width: 8px;
      height: 8px;
      background: var(--ink-muted);
      border-radius: 50%;
      animation: typingBounce 1.4s ease-in-out infinite;
    }

    .typing-indicator__dot:nth-child(1) { animation-delay: 0s; }
    .typing-indicator__dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator__dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingBounce {
      0%, 60%, 100% {
        transform: translateY(0);
      }
      30% {
        transform: translateY(-8px);
      }
    }

    @media (max-width: 480px) {
      .coach-panel {
        width: 100%;
        right: -100%;
      }
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <h1 class="demo-title">🧙 AI Coach Panel</h1>
    <p class="demo-subtitle">SIGGRAPH-Tier Storybook Experience</p>
    <button class="toggle-btn" onclick="toggleCoach()">
      Ask the Wisdom Sage
    </button>
  </div>

  <div class="coach-panel" id="coachPanel">
    <div class="coach-panel__header">
      <div class="coach-panel__title">
        <svg class="owl-icon" viewBox="0 0 100 100">
          <ellipse cx="50" cy="55" rx="30" ry="35" fill="#70a1d7" stroke="#4a3e35" stroke-width="2.5"/>
          <circle cx="50" cy="32" r="22" fill="#70a1d7" stroke="#4a3e35" stroke-width="2.5"/>
          <ellipse cx="40" cy="30" rx="10" ry="12" fill="#e8d5a3" stroke="#4a3e35" stroke-width="1.5"/>
          <ellipse cx="60" cy="30" rx="10" ry="12" fill="#e8d5a3" stroke="#4a3e35" stroke-width="1.5"/>
          <circle cx="40" cy="30" r="5" fill="#4a3e35"/>
          <circle cx="60" cy="30" r="5" fill="#4a3e35"/>
          <circle cx="38" cy="28" r="2" fill="white" opacity="0.8"/>
          <circle cx="58" cy="28" r="2" fill="white" opacity="0.8"/>
          <path d="M 47,35 L 50,42 L 53,35 Z" fill="#f4a261" stroke="#4a3e35" stroke-width="1.5"/>
        </svg>
        <h2 class="coach-panel__title-text">AI Coach</h2>
      </div>
      <button class="coach-panel__close" onclick="toggleCoach()" aria-label="Close">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <div class="coach-panel__messages" id="messages">
      <div class="coach-message">
        <div class="coach-message__avatar">
          <svg viewBox="0 0 100 100" width="40" height="40">
            <ellipse cx="50" cy="55" rx="30" ry="35" fill="#70a1d7" stroke="#4a3e35" stroke-width="2.5"/>
            <circle cx="50" cy="32" r="22" fill="#70a1d7" stroke="#4a3e35" stroke-width="2.5"/>
            <ellipse cx="40" cy="30" rx="10" ry="12" fill="#e8d5a3" stroke="#4a3e35" stroke-width="1.5"/>
            <ellipse cx="60" cy="30" rx="10" ry="12" fill="#e8d5a3" stroke="#4a3e35" stroke-width="1.5"/>
            <circle cx="40" cy="30" r="5" fill="#4a3e35"/>
            <circle cx="60" cy="30" r="5" fill="#4a3e35"/>
            <circle cx="38" cy="28" r="2" fill="white" opacity="0.8"/>
            <circle cx="58" cy="28" r="2" fill="white" opacity="0.8"/>
            <path d="M 47,35 L 50,42 L 53,35 Z" fill="#f4a261" stroke="#4a3e35" stroke-width="1.5"/>
          </svg>
        </div>
        <div class="coach-message__bubble coach-message__bubble--coach">
          <div class="coach-message__content">Welcome, seeker! I'm here to illuminate the paths of relational wisdom. What aspect of relationships would you like to explore today?</div>
          <div class="coach-message__timestamp">a moment ago</div>
        </div>
      </div>
    </div>

    <div class="coach-panel__suggestions">
      <div class="coach-panel__suggestions-label">💭 Suggested questions:</div>
      <div class="coach-panel__suggestions-chips">
        <button class="suggestion-chip" onclick="askQuestion('What makes relationships thrive?')">What makes relationships thrive?</button>
        <button class="suggestion-chip" onclick="askQuestion('How do I build deeper connections?')">How do I build deeper connections?</button>
        <button class="suggestion-chip" onclick="askQuestion('Tell me about healthy boundaries')">Tell me about healthy boundaries</button>
      </div>
    </div>

    <div class="coach-panel__input">
      <div class="coach-panel__input-wrapper">
        <textarea
          id="messageInput"
          class="coach-panel__textarea"
          placeholder="Ask the wisdom sage..."
          rows="1"></textarea>
        <button class="coach-panel__send" id="sendBtn" onclick="sendMessage()">→</button>
      </div>
    </div>
  </div>

  <script>
    const coachPanel = document.getElementById('coachPanel');
    const messages = document.getElementById('messages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');

    function toggleCoach() {
      coachPanel.classList.toggle('open');
    }

    function askQuestion(question) {
      messageInput.value = question;
      sendMessage();
    }

    function sendMessage() {
      const content = messageInput.value.trim();
      if (!content) return;

      // Add user message
      addMessage('user', content);
      messageInput.value = '';

      // Show typing indicator
      showTyping();

      // Simulate response
      setTimeout(() => {
        removeTyping();
        addMessage('coach', `That is a wonderful question about "${content}". Let me share some wisdom... Relationships thrive when we approach them with curiosity, compassion, and courage. The journey of understanding ourselves and others is one of life's greatest adventures.`);
      }, 2000);
    }

    function addMessage(role, content) {
      const messageDiv = document.createElement('div');
      messageDiv.className = 'coach-message';

      if (role === 'coach') {
        messageDiv.innerHTML = `
          <div class="coach-message__avatar">
            <svg viewBox="0 0 100 100" width="40" height="40">
              <ellipse cx="50" cy="55" rx="30" ry="35" fill="#70a1d7" stroke="#4a3e35" stroke-width="2.5"/>
              <circle cx="50" cy="32" r="22" fill="#70a1d7" stroke="#4a3e35" stroke-width="2.5"/>
              <ellipse cx="40" cy="30" rx="10" ry="12" fill="#e8d5a3" stroke="#4a3e35" stroke-width="1.5"/>
              <ellipse cx="60" cy="30" rx="10" ry="12" fill="#e8d5a3" stroke="#4a3e35" stroke-width="1.5"/>
              <circle cx="40" cy="30" r="5" fill="#4a3e35"/>
              <circle cx="60" cy="30" r="5" fill="#4a3e35"/>
              <circle cx="38" cy="28" r="2" fill="white" opacity="0.8"/>
              <circle cx="58" cy="28" r="2" fill="white" opacity="0.8"/>
              <path d="M 47,35 L 50,42 L 53,35 Z" fill="#f4a261" stroke="#4a3e35" stroke-width="1.5"/>
            </svg>
          </div>
          <div class="coach-message__bubble coach-message__bubble--coach">
            <div class="coach-message__content">${content}</div>
            <div class="coach-message__timestamp">a moment ago</div>
          </div>
        `;
      } else {
        messageDiv.style.justifyContent = 'flex-end';
        messageDiv.innerHTML = `
          <div class="coach-message__bubble coach-message__bubble--user">
            <div class="coach-message__content">${content}</div>
            <div class="coach-message__timestamp">a moment ago</div>
          </div>
        `;
      }

      messages.appendChild(messageDiv);
      messages.scrollTop = messages.scrollHeight;
    }

    function showTyping() {
      const typingDiv = document.createElement('div');
      typingDiv.className = 'coach-message';
      typingDiv.id = 'typingIndicator';
      typingDiv.innerHTML = `
        <div class="coach-message__avatar">
          <svg viewBox="0 0 100 100" width="40" height="40">
            <ellipse cx="50" cy="55" rx="30" ry="35" fill="#70a1d7" stroke="#4a3e35" stroke-width="2.5"/>
            <circle cx="50" cy="32" r="22" fill="#70a1d7" stroke="#4a3e35" stroke-width="2.5"/>
            <ellipse cx="40" cy="30" rx="10" ry="12" fill="#e8d5a3" stroke="#4a3e35" stroke-width="1.5"/>
            <ellipse cx="60" cy="30" rx="10" ry="12" fill="#e8d5a3" stroke="#4a3e35" stroke-width="1.5"/>
            <circle cx="40" cy="30" r="5" fill="#4a3e35"/>
            <circle cx="60" cy="30" r="5" fill="#4a3e35"/>
            <circle cx="38" cy="28" r="2" fill="white" opacity="0.8"/>
            <circle cx="58" cy="28" r="2" fill="white" opacity="0.8"/>
            <path d="M 47,35 L 50,42 L 53,35 Z" fill="#f4a261" stroke="#4a3e35" stroke-width="1.5"/>
          </svg>
        </div>
        <div class="coach-message__bubble coach-message__bubble--coach">
          <div class="typing-indicator">
            <span class="typing-indicator__dot"></span>
            <span class="typing-indicator__dot"></span>
            <span class="typing-indicator__dot"></span>
          </div>
        </div>
      `;
      messages.appendChild(typingDiv);
      messages.scrollTop = messages.scrollHeight;
    }

    function removeTyping() {
      const typing = document.getElementById('typingIndicator');
      if (typing) typing.remove();
    }

    messageInput.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });

    messageInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
