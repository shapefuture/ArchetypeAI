  <style>
    :root {
      --paper-bg: #fbf3e3;
      --ink-main: #201a3a;
      --accent-orange: #ffb03a;
    }
    html, body {
      width: 100%;
      min-height: 100dvh;
      margin: 0;
      overflow: hidden;
      background: #fbf3e3;
    }
    app-root {
      display: block;
      width: 100%;
      min-height: 100dvh;
    }
    .loading-screen {
      position: absolute;
      inset: 0;
      width: 100%;
      min-height: 100dvh;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 42%, rgba(255, 194, 60, 0.18), transparent 22rem),
        linear-gradient(180deg, #191833 0%, #12122b 58%, #0d0d24 100%);
      color: #f2e7c9;
    }
    .loading-constellation-canvas,
    .loading-orbits {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .loading-orbits {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .loading-orbit {
      position: absolute;
      border-radius: 50%;
      opacity: 1;
    }
    .loading-orbit--1 { width: 200px; height: 200px; border: 2px solid rgba(226, 230, 246, 0.12); }
    .loading-orbit--2 { width: 320px; height: 320px; border: 1px solid rgba(255, 107, 87, 0.18); }
    .loading-orbit--3 { width: 460px; height: 460px; border: 1px solid rgba(226, 230, 246, 0.08); }
    .loading-blob-container {
      position: relative;
      z-index: 10;
      width: 160px;
      height: 160px;
      margin-bottom: 2rem;
      filter: drop-shadow(8px 12px 0 rgba(0, 0, 0, 0.35));
    }
    .loading-blob-container app-blob-character {
      display: block;
      width: 160px;
      height: 160px;
    }
    .loading-text-container,
    .loading-progress-track,
    .loading-dots,
    .loading-tagline {
      position: relative;
      z-index: 10;
    }
    .loading-text {
      max-width: min(560px, 85vw);
      margin: 0;
      color: #f2e7c9;
      font: 600 clamp(1.3rem, 3vw, 1.8rem) 'Fraunces', Georgia, serif;
      text-align: center;
    }
    .loading-progress-track {
      width: 200px;
      height: 3px;
      margin-top: 1.8rem;
      overflow: hidden;
      border-radius: 3px;
      border: 2px solid rgba(242, 231, 201, 0.4);
      background: rgba(226, 230, 246, 0.12);
    }
    .loading-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #ffc23c, #ff6b57);
    }
    .loading-tagline {
      margin-top: 1.4rem;
      color: rgba(226, 230, 246, 0.42);
      font: 900 9px system-ui, sans-serif;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }
  </style>

<body class="antialiased overflow-hidden">
  <app-root></app-root>
  <script>
    // PWA installability + offline shell. Skipped on the dev server so
    // hot reload is never served from cache.
    //
    // Update flow (the "never clear cookies again" contract):
    //   register updateViaCache:none → browser always revalidates sw.js;
    //   new sw.js installs → skipWaiting → activate → clients.claim →
    //   controllerchange → ONE controlled reload → fresh shell + assets.
    // First install also claims, so we only reload when a controller
    // already existed at page load (an update, not the first visit).
    if ('serviceWorker' in navigator && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
      window.addEventListener('load', () => {
        // Attach the reload listener BEFORE registering: the browser's own
        // navigation-triggered update check can install + claim a new worker
        // while the page is still loading — a listener attached later misses
        // that controllerchange and the page never reloads into the new build.
        const hadController = !!navigator.serviceWorker.controller;
        let reloaded = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!hadController || reloaded) return;
          reloaded = true;
          window.location.reload();
        });
        navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
          // Explicit update() is NOT subject to the browser's ~24h update-check
          // throttle, so every page load discovers a freshly deployed worker
          // instead of waiting for the next throttled navigation check.
          .then(reg => reg?.update())
          .catch(() => {});
        // Persistent PWA sessions never navigate; nudge the browser to
        // check for a new worker when the app becomes visible and hourly.
        const check = () => navigator.serviceWorker.getRegistration().then(r => r?.update()).catch(() => {});
        document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
        setInterval(check, 60 * 60 * 1000);
      });
    }
  </script>
</body>
</html>
