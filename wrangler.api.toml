# API-only deploy of the AI worker. Same worker name as the original
# (wrangler.toml) so the existing Cloudflare secrets survive. The site
# itself is served from Firebase Hosting; this worker is called
# cross-origin from the app (CORS handled in worker.ts).
name = "archetypeai-worker"
main = "worker.ts"
compatibility_date = "2026-04-13"
compatibility_flags = ["nodejs_compat"]

[vars]
# Do NOT commit real API keys. API keys (GOOGLE_API_KEY, OPENROUTER_API_KEY,
# NVIDIA_API_KEY, OLLAMA_API_KEY) live in Cloudflare's encrypted secret store
# and are set via `wrangler secret put <KEY_NAME>`.
FIREBASE_PROJECT_ID = "archetype-ai-3e43b"  # required: without it the worker 503s instead of authenticating requests
ALLOWED_APP_ORIGINS = "https://archetype-ai-3e43b.web.app,https://archetype-ai-3e43b.firebaseapp.com,https://innerverseai.web.app,https://innerverseai.firebaseapp.com"  # production origins only; local dev keeps localhost via the worker-security.ts default
OPENROUTER_MODEL = "nvidia/nemotron-3-ultra-550b-a55b:free"
AI_PROVIDER_DEFAULT = "ollama"
